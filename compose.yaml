services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: jira_automation
      POSTGRES_USER: jira_automation
      POSTGRES_PASSWORD: local-development-only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jira_automation -d jira_automation"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
